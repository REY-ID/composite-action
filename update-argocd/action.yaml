name: 'Update ArgoCD Tag'
description: 'Update ArgoCD Tag in github repository'

inputs:
  ARGO_REPO:
    description: 'ArgoCD repository'
    required: true
  SERVICE_NAME:
    description: 'Service name'
    required: true
  PAT:
    description: 'Personal Access Token'
    required: true
  IMAGE_TAG:
    description: 'Image tag'
    required: true
  SLACK_WEBHOOK:
    description: 'Slack Webhook'
    required: false

runs:
  using: "composite"
  steps:
    - name: Checkout ArgoCD repository
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.ARGO_REPO }}
        path: infrastructure
        token: ${{ inputs.PAT }}

    # Retry wrapper around yaml-update-action: pushes to the shared GitOps repo's
    # `master` can transiently fail (non-fast-forward / ref replication lag) when
    # multiple services deploy near-simultaneously. On failure the action's
    # updateRef falls back to createRef, surfacing a misleading
    # "Reference already exists". Wandalen/wretry retries the whole step; each
    # attempt re-reads HEAD, so the retry clears the race. Same inputs as before
    # (unset inputs fall back to the action's own defaults) — only retry is added.
    - name: Update ArgoCD image tag
      uses: Wandalen/wretry.action@v3.8.0
      with:
        action: fjogeleit/yaml-update-action@v0.12.2
        attempt_limit: 3
        attempt_delay: 15000
        with: |
          repository: ${{ inputs.ARGO_REPO }}
          valueFile: ${{ inputs.SERVICE_NAME }}/values.yaml
          propertyPath: 'image.tag'
          value: "${{ inputs.IMAGE_TAG }}"
          message: update ${{ inputs.SERVICE_NAME }} image tag to ${{ inputs.IMAGE_TAG }}
          createPR: false
          workDir: infrastructure
          token: ${{ inputs.PAT }}

    - name: Notify slack if fail
      if: ${{ failure() && inputs.SLACK_WEBHOOK }}
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: ${{ inputs.SLACK_WEBHOOK }}
        SLACK_COLOR: "#CE5A51"
        SLACK_MESSAGE: "Updating ArgoCD tag for `${{ inputs.SERVICE_NAME }}` has failed"
        MSG_MINIMAL: "actions url"